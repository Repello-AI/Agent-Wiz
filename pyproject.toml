[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repello-agent-wiz"
version = "0.5.0"
description = "Generate agentic workflows visualizations & threat modelling reports for your agentic projects."
readme = "README.md"
authors = [{ name = "Aryan Ranjan", email = "aryan@repello.ai" },  { name = "Aaditya Gupta"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security"
]

dependencies = [
    "openai>=2.3.0,<3.0.0",
    "PyYAML>=6.0.3,<6.1.0",
    "pydantic>=2.12.0,<2.13.0",
    "tqdm>=4.67.1,<4.68.0",
    "httpx>=0.28.1,<0.29.0",
    "anyio>=4.11.0,<5.0.0",
    "sniffio>=1.3.1,<2.0.0",
    "rich>=14.2.0,<15.0.0",
    "logfire>=4.13.0,<5.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "supabase>=2.22.0,<3.0.0",
    "devtools>=0.12.2,<1.0.0",
    "pydantic-ai>=1.0.17,<2.0.0",
    "Pillow>=11.3.0,<12.0.0",
    "selenium>=4.36.0,<5.0.0",
    "google-cloud-bigquery>=3.10.0,<4.0.0",
    "pyserini>=0.19.0,<0.45.0",
    "thefuzz>=0.20.0,<1.0.0",
    "pytz>=2025.2,<2026.0",
    "langchain-core>=0.1.0,<1.0.0",
    "langchain-anthropic>=0.1.0,<1.0.0",
    "langchain-community>=0.1.0,<1.0.0"
]


[project.scripts]
agent-wiz = "repello_agent_wiz.cli:main"

[project.urls]
"Homepage" = "https://github.com/Repello-AI/agent-wiz/"
"Bug Tracker" = "https://github.com/Repello-AI/wiz/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repello_agent_wiz.analyzers" = ["*.txt"]
"repello_agent_wiz.templates" = ["index.html", "assets/*"]
